name: iOS CI

# Build + run tests on every PR and on pushes to main (P0-02).
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iOS Simulator
        id: sim
        # Choose the newest available iPhone simulator so we don't hard-code a
        # device name that may differ across runner images.
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
              cands=[d for rt in ds for d in ds[rt] if d['isAvailable'] and 'iPhone' in d['name']]; \
              print(cands[-1]['udid'] if cands else '')")
          if [ -z "$UDID" ]; then echo 'No iPhone simulator available'; exit 1; fi
          echo "Selected simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Alltag.xcodeproj \
            -scheme Alltag \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
        env:
          NSUnbufferedIO: "YES"
