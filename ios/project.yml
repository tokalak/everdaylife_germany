# Alltag — XcodeGen project spec (P0-01)
#
# The .xcodeproj is GENERATED from this file and is .gitignored.
# Regenerate locally with:  cd ios && xcodegen generate
#
# Signing is deferred (D-decision): the project builds for the Simulator and CI
# without a signing identity. To run on a physical device or upload to App Store
# Connect, fill in DEVELOPMENT_TEAM and flip CODE_SIGNING_ALLOWED to YES below.

name: Alltag

# The real on-device llama.cpp/Metal runtime is linked via this overlay, but
# ONLY when ALLTAG_LLAMA_RUNTIME is truthy at generate time — so CI/Simulator
# builds (which don't vendor the multi-GB binary framework) keep building the
# development stub. Vendor the framework with scripts/build-llama-xcframework.sh,
# then generate with `ALLTAG_LLAMA_RUNTIME=true xcodegen generate` (or just run
# scripts/deploy-device.sh, which sets the flag when the framework is present).
include:
  - path: project.llama.yml
    enable: ${ALLTAG_LLAMA_RUNTIME}

options:
  bundleIdPrefix: de.everydaygermany
  developmentLanguage: de          # German is the default/dev language (D7)
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "QL567J384H"  # Apple Development: tokalak@protonmail.com
    CODE_SIGN_STYLE: Automatic
    # Deferred signing: simulator/CI builds need no identity.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  Alltag:
    type: application
    platform: iOS
    sources:
      - path: Alltag
    # Raise the per-app jetsam memory limit so the on-device model stays resident
    # with headroom. The current model (Qwen3.5-0.8B Q4_K_M, ~0.5 GB) is small
    # enough not to need this on most devices, but llama.cpp offloads all layers
    # to Metal (n_gpu_layers = 999) so the weights live in unified memory counted
    # against the app; the entitlement is kept as harmless headroom (and to keep
    # the door open for a larger model). XcodeGen generates the .entitlements
    # file from these properties and wires CODE_SIGN_ENTITLEMENTS.
    entitlements:
      path: Alltag/Alltag.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.everydaygermany.app
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        # Decoder letter scanning (P3-01). Processed on-device, never uploaded (X-03).
        INFOPLIST_KEY_NSCameraUsageDescription: "Alltag uses the camera so you can scan an official letter. The photo is read on this device only and never leaves your phone."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"   # iPhone (iOS-first, D3)
        GENERATE_INFOPLIST_FILE: "YES"
    postBuildScripts:
      # Bundle the default on-device model into the app *if the weights are
      # present*, so physical-device builds ship ready (no first-run download).
      # The weights are gitignored (large) and only present after
      # scripts/fetch-model.sh, so this must stay OPTIONAL: a plain resource
      # reference hard-fails the build when the file is absent (Simulator/CI/
      # fresh checkout). Runs after Copy Bundle Resources and before code
      # signing, so the copied file is sealed into the signature. When absent,
      # it no-ops and the app falls back to its runtime download path;
      # ModelStore treats a bundled copy as already installed. Keep the filename
      # in sync with LLMModelCatalog.defaultQuant (currently Qwen3.5-0.8B Q4_K_M).
      - name: Bundle on-device model (if present)
        inputFiles:
          - $(SRCROOT)/Models/Qwen3.5-0.8B-Q4_K_M.gguf
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Qwen3.5-0.8B-Q4_K_M.gguf
        script: |
          set -euo pipefail
          SRC="${SCRIPT_INPUT_FILE_0}"
          DST="${SCRIPT_OUTPUT_FILE_0}"
          if [ -f "$SRC" ]; then
            # cp writes straight to $DST (the declared, sandbox-permitted output);
            # rsync would stage a temp file the script sandbox forbids.
            /bin/cp -f "$SRC" "$DST"
            echo "note: bundled on-device model ($(basename "$SRC")) into the app"
          else
            echo "warning: on-device model not found at $SRC — app will download it at runtime"
            rm -f "$DST" || true
          fi

  AlltagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AlltagTests
    dependencies:
      - target: Alltag
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.everydaygermany.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Alltag:
    build:
      targets:
        Alltag: all
    test:
      targets:
        - AlltagTests
      gatherCoverageData: true
